name: Build Android Agent APK

on:
  push:
    paths:
      - 'android-agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android-agent/gradlew

      - name: Build debug APK
        working-directory: android-agent
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
      
      - name: Compute signature checksum
        working-directory: android-agent/app/build/outputs/apk/debug
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -n1)
          echo "Using apksigner: $APKSIGNER"
          CERT_SHA256_HEX=$("$APKSIGNER" verify --print-certs app-debug.apk | grep 'SHA-256 digest' | head -n1 | awk '{print $NF}')
          echo "Cert SHA-256 (hex): $CERT_SHA256_HEX"
          CHECKSUM=$(echo -n "$CERT_SHA256_HEX" | xxd -r -p | openssl base64 | tr '+/' '-_' | tr -d '=')
          echo "Signature checksum: $CHECKSUM"
          echo "$CHECKSUM" > checksum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksum
          path: android-agent/app/build/outputs/apk/debug/checksum.txt