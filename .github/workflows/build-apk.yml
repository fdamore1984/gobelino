name: Build Android Agent APK

on:
  push:
    paths:
      - 'android-agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android-agent/gradlew

      # --- NUOVO: ripristina il keystore di debug fisso dal secret ---
      - name: Decode debug keystore
        working-directory: android-agent
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

      - name: Build debug APK
        working-directory: android-agent
        env:
          DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/android-agent/debug.keystore
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk

      - name: Compute APK file checksum
        working-directory: android-agent/app/build/outputs/apk/debug
        run: |
          # PROVISIONING_DEVICE_ADMIN_PACKAGE_CHECKSUM vuole lo SHA-256
          # dell'INTERO file .apk (non del certificato di firma!),
          # base64 URL-safe senza padding.
          CHECKSUM=$(sha256sum app-debug.apk | cut -d' ' -f1 | xxd -r -p | openssl base64 | tr '+/' '-_' | tr -d '=')
          echo "APK file checksum: $CHECKSUM"
          echo "$CHECKSUM" > checksum.txt
          echo "APK_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: checksum
          path: android-agent/app/build/outputs/apk/debug/checksum.txt

      # --- pubblica l'APK sul repo cosi' Railway lo re-deploya ---
      - name: Copy APK into Laravel public folder
        run: cp android-agent/app/build/outputs/apk/debug/app-debug.apk public/apk/app-debug.apk

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/apk/app-debug.apk
          git commit -m "chore: aggiorna APK debug [skip ci]" || echo "Nessuna modifica da committare"
          git push

      # --- aggiorna la variabile d'ambiente su Railway ---
      - name: Setup Railway CLI
        run: npm i -g @railway/cli

      - name: Update APK checksum on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway variables --set "AGENT_APK_CHECKSUM=$APK_CHECKSUM" --service web
