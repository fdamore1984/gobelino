name: Build Android Agent APK

on:
  push:
    paths:
      - 'android-agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android-agent/gradlew

      - name: Build debug APK
        working-directory: android-agent
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk

      - name: Compute signature checksum
        working-directory: android-agent/app/build/outputs/apk/debug
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | head -n1)
          echo "Using apksigner: $APKSIGNER"
          CERT_SHA256_HEX=$("$APKSIGNER" verify --print-certs app-debug.apk | grep 'SHA-256 digest' | head -n1 | awk '{print $NF}')
          echo "Cert SHA-256 (hex): $CERT_SHA256_HEX"
          CHECKSUM=$(echo -n "$CERT_SHA256_HEX" | xxd -r -p | openssl base64 | tr '+/' '-_' | tr -d '=')
          echo "Signature checksum: $CHECKSUM"
          echo "$CHECKSUM" > checksum.txt
          echo "APK_CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: checksum
          path: android-agent/app/build/outputs/apk/debug/checksum.txt

      # --- NUOVO: aggiorna la variabile d'ambiente su Railway (PRIMA del push, cosi' il deploy finale la trova gia' corretta) ---
      - name: Setup Railway CLI
        run: npm i -g @railway/cli

      - name: Update APK checksum on Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway variables --set "AGENT_APK_CHECKSUM=$APK_CHECKSUM" --service web

      # --- NUOVO: pubblica l'APK sul repo cosi' Railway lo re-deploya ---
      - name: Copy APK into Laravel public folder
        run: cp android-agent/app/build/outputs/apk/debug/app-debug.apk public/apk/app-debug.apk

      - name: Commit and push APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/apk/app-debug.apk
          git commit -m "chore: aggiorna APK debug [skip ci]" || echo "Nessuna modifica da committare"
          git push
